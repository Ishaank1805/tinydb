# Run once after setup: validates config, secrets, model access (a two-turn tool
# call per configured model), repository settings and the harness's own tests.
name: AutoSE doctor

on:
  workflow_dispatch:

permissions: {}

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness
        run: python -m pip install --disable-pip-version-check -q -r repo/.github/autose/requirements.txt
      - name: Stage model credentials
        env:
          T_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          T_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          T_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          T_GEMINI2: ${{ secrets.GEMINI_API_KEY_2 }}
          T_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/autose-secrets"
          put() { if [ -n "$2" ]; then printf '%s' "$2" > "$RUNNER_TEMP/autose-secrets/$1"; fi; }
          put ANTHROPIC_API_KEY "$T_ANTHROPIC"
          put OPENAI_API_KEY "$T_OPENAI"
          put GEMINI_API_KEY "$T_GEMINI"
          put GEMINI_API_KEY_2 "$T_GEMINI2"
          put OPENROUTER_API_KEY "$T_OPENROUTER"
      - name: Doctor
        env:
          AUTOSE_GITHUB_TOKEN: ${{ github.token }}
          AUTOSE_SECRETS_DIR: ${{ runner.temp }}/autose-secrets
          AUTOSE_REPO_DIR: ${{ github.workspace }}/repo
          PYTHONPATH: ${{ github.workspace }}/repo/.github/autose
        run: python -m autose doctor
