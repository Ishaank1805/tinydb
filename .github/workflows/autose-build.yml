# Stages 1-5 for one round (round 0 = from the issue, round >= 1 = rework after
# a review). Called by autose.yml; never triggered directly.
name: AutoSE build

on:
  workflow_call:
    inputs:
      issue: {type: string, required: true}
      round: {type: number, required: true}
      start_stage: {type: string, required: true}
      variant: {type: string, required: false, default: ""}
      branch: {type: string, required: true}
      status_comment_id: {type: string, required: false, default: ""}
      state_artifact: {type: string, required: false, default: ""}
      review_artifact: {type: string, required: false, default: ""}
    outputs:
      status:
        description: "released | stopped | error"
        value: ${{ jobs.build.outputs.status }}
      pr:
        value: ${{ jobs.build.outputs.pr }}
      pr_url:
        value: ${{ jobs.build.outputs.pr_url }}
      head_sha:
        value: ${{ jobs.build.outputs.head_sha }}
      stopped_stage:
        value: ${{ jobs.build.outputs.stopped_stage }}
      reason:
        value: ${{ jobs.build.outputs.reason }}

jobs:
  build:
    name: ${{ inputs.round == 0 && 'stages 1-5' || format('rework round {0}', inputs.round) }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write          # push the autose/* branch (never main: branch protection)
      pull-requests: write     # open/update the PR
      issues: write            # status comment, stop comment
      actions: write           # workflow_dispatch the CI workflow (GITHUB_TOKEN pushes do not trigger it)
    outputs:
      status: ${{ steps.run.outputs.status }}
      pr: ${{ steps.run.outputs.pr }}
      pr_url: ${{ steps.run.outputs.pr_url }}
      head_sha: ${{ steps.run.outputs.head_sha }}
      stopped_stage: ${{ steps.run.outputs.stopped_stage }}
      reason: ${{ steps.run.outputs.reason }}
    steps:
      - name: Paths
        run: |
          {
            echo "PYTHONPATH=$GITHUB_WORKSPACE/_harness/.github/autose"
            echo "AUTOSE_REPO_DIR=$GITHUB_WORKSPACE/repo"
            echo "AUTOSE_TARGET_VENV=$RUNNER_TEMP/target-venv"
            echo "AUTOSE_STATE_DIR=$RUNNER_TEMP/autose-state"
            echo "AUTOSE_INPUT_DIR=$RUNNER_TEMP/autose-in"
            echo "AUTOSE_SCRATCH_DIR=$RUNNER_TEMP/autose-scratch"
            echo "AUTOSE_SECRETS_DIR=$RUNNER_TEMP/autose-secrets"
          } >> "$GITHUB_ENV"
      - name: Check out the harness (default branch, same commit as this workflow)
        uses: actions/checkout@v4
        with:
          path: _harness
          sparse-checkout: .github/autose
          persist-credentials: false
      - name: Check out the target (base commit, or the PR branch for a rework)
        uses: actions/checkout@v4
        with:
          path: repo
          ref: ${{ inputs.round == 0 && github.sha || inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness
        run: python -m pip install --disable-pip-version-check -q -r _harness/.github/autose/requirements.txt
      - name: Prepare the target's own virtualenv
        run: python -m autose setup-target
      - name: Download the issue snapshot
        uses: actions/download-artifact@v4
        with:
          name: autose-issue
          path: ${{ runner.temp }}/autose-in/issue
      - name: Download the state of the previous round
        if: inputs.state_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.state_artifact }}
          path: ${{ runner.temp }}/autose-in/state
      - name: Download the review to address
        if: inputs.review_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.review_artifact }}
          path: ${{ runner.temp }}/autose-in/review
      - name: Stage credentials (files; the harness reads and deletes them before any agent starts)
        env:
          T_GITHUB: ${{ github.token }}
          T_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          T_OPENAI: ${{ secrets.OPENAI_API_KEY }}
          T_GEMINI: ${{ secrets.GEMINI_API_KEY }}
          T_GEMINI2: ${{ secrets.GEMINI_API_KEY_2 }}
          T_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          umask 077
          mkdir -p "$AUTOSE_SECRETS_DIR"
          put() { if [ -n "$2" ]; then printf '%s' "$2" > "$AUTOSE_SECRETS_DIR/$1"; fi; }
          put AUTOSE_GITHUB_TOKEN "$T_GITHUB"
          put ANTHROPIC_API_KEY "$T_ANTHROPIC"
          put OPENAI_API_KEY "$T_OPENAI"
          put GEMINI_API_KEY "$T_GEMINI"
          put GEMINI_API_KEY_2 "$T_GEMINI2"
          put OPENROUTER_API_KEY "$T_OPENROUTER"
      - name: Run the stages
        id: run
        env:
          AUTOSE_ISSUE: ${{ inputs.issue }}
          AUTOSE_ROUND: ${{ inputs.round }}
          AUTOSE_START_STAGE: ${{ inputs.start_stage }}
          AUTOSE_VARIANT: ${{ inputs.variant }}
          AUTOSE_BRANCH: ${{ inputs.branch }}
          AUTOSE_STATUS_COMMENT_ID: ${{ inputs.status_comment_id }}
        run: python -m autose build
      - name: Upload state and artifacts (spec.md, design.md, diff.patch, test_report.md, pr.md, ...)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autose-state-r${{ inputs.round }}
          path: ${{ runner.temp }}/autose-state
          overwrite: true
          retention-days: 90
